<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fishquation • Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/profile.css" />
  <style>
    
    .main-content {
      padding-bottom: 120px !important;
      overflow-y: auto;
      max-height: 100vh;
    }
    
    @media (min-width: 768px) {
      .main-content {
        padding-bottom: 40px !important;
      }
    }
    
    .actions-section {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <div class="logo-image">
            <img src="images/logobgremove.png" alt="Fishquation Logo" />
          </div>
          <div class="logo-text">Fishquation</div>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">▶</span>
          <span>Play</span>
        </a>
        <a href="sandbox.html" class="nav-item">
          <span class="nav-icon">🧪</span>
          <span>Sandbox</span>
        </a>
        <a href="achievements.html" class="nav-item">
          <span class="nav-icon">🏆</span>
          <span>Achievements</span>
        </a>
        <a href="store.html" class="nav-item">
          <span class="nav-icon">🛒</span>
          <span>Store</span>
        </a>
        <a href="profile.html" class="nav-item active">
          <span class="nav-icon">👤</span>
          <span>Profile</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <h1 class="page-title">Profile</h1>

      <div class="profile-header">
        <div class="profile-avatar-large">
          <img src="images/jeffimage.png" alt="Profile Avatar" id="profileAvatar" />
          <button class="edit-badge">✏️</button>
        </div>
        <div class="profile-info">
          <h2 class="profile-username" id="profileUsername">Player</h2>
          <div class="profile-level">Level 1 Explorer</div>
        </div>
      </div>

      <div class="stats-section">
        <h3 class="section-title">Stats</h3>
        <div class="stats-grid">
          <div class="stat-card orange">
            <div class="stat-icon">⚡</div>
            <div class="stat-label">XP</div>
            <div class="stat-value" id="statXP">0</div>
          </div>

          <div class="stat-card orange">
            <div class="stat-icon">🔥</div>
            <div class="stat-label">Streak</div>
            <div class="stat-value" id="statStreak">0 days</div>
          </div>

          <div class="stat-card blue">
            <div class="stat-icon">⏱️</div>
            <div class="stat-label">Best Time</div>
            <div class="stat-value" id="statBestTime">1:45</div>
          </div>

          <div class="stat-card purple">
            <div class="stat-icon">🏆</div>
            <div class="stat-label">Achievement</div>
            <div class="stat-value" id="statAchievement">5/8</div>
          </div>
        </div>
      </div>

      <div class="cosmetics-section">
        <h3 class="section-title">Equipped Cosmetics</h3>
        <div class="cosmetic-card">
          <div class="cosmetic-preview">
            <img src="images/jeffdefaultskin.png" alt="Classic Shark" id="cosmeticImage" />
          </div>
          <div class="cosmetic-info">
            <div class="cosmetic-icon">🦈</div>
            <div class="cosmetic-details">
              <div class="cosmetic-label">Skin</div>
              <div class="cosmetic-name" id="cosmeticName">Classic Shark</div>
            </div>
            <div class="cosmetic-status">Equipped</div>
          </div>
        </div>
      </div>

      <div class="actions-section">
        <button class="action-btn contact" onclick="window.location.href='contact.html'">
          <span class="action-icon">📧</span>
          <div class="action-content">
            <div class="action-title">Contact & About</div>
            <div class="action-subtitle">Get in touch</div>
          </div>
          <span class="action-arrow">→</span>
        </button>

        <button class="action-btn logout" id="logoutBtn">
          <span class="action-icon">🔓</span>
          <span class="action-text">Log Out</span>
        </button>
      </div>
    </main>

    <nav class="bottom-nav d-md-none">
      <a href="dashboard.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">▶</span>
        <span>Play</span>
      </a>
      <a href="sandbox.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">🧪</span>
        <span>Sandbox</span>
      </a>
      <a href="achievements.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">🏆</span>
        <span>Achieve</span>
      </a>
      <a href="store.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">🛒</span>
        <span>Store</span>
      </a>
      <a href="profile.html" class="bottom-nav-item active">
        <span class="bottom-nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "{}");

    const skinData = {
      classic: { name: 'Classic Shark', image: 'images/jeffdefaultskin.png' },
      dolphin: { name: 'Dolphin Shark', image: 'images/dolphinshark.png' },
      winter: { name: 'Winter Shark', image: 'images/wintershark.png' },
      venom: { name: 'Venom Shark', image: 'images/venomshark.png' }
    };

    if (currentUser.username) {
      document.getElementById("profileUsername").textContent = currentUser.username;
    }

    const level = currentUser.level || 1;
    const experienceType = currentUser.selectedExperience || "Beginner Math";
    const badge = experienceType === "Beginner Math" ? "Beginner" : "Advanced";
    
    document.getElementById("profileUsername").textContent = currentUser.username || "Player";
    document.querySelector(".profile-level").textContent = `Level ${level} ${badge} Explorer`;

    if (currentUser.xp) {
      document.getElementById("statXP").textContent = currentUser.xp;
    }

    if (currentUser.streak) {
      document.getElementById("statStreak").textContent = `${currentUser.streak} days`;
    }

    if (currentUser.equippedSkin && skinData[currentUser.equippedSkin]) {
      const equippedSkin = currentUser.equippedSkin;
      document.getElementById("cosmeticImage").src = skinData[equippedSkin].image;
      document.getElementById("cosmeticImage").alt = skinData[equippedSkin].name;
      document.getElementById("cosmeticName").textContent = skinData[equippedSkin].name;
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      if (confirm("Are you sure you want to log out?")) {
        localStorage.removeItem("currentUser");
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
