<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fishquation • Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <div class="logo-image">
            <img src="images/logobgremove.png" alt="Fishquation Logo" />
          </div>
          <div class="logo-text">Fishquation</div>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item active">
          <span class="nav-icon">▶</span>
          <span>Play</span>
        </a>
        <a href="sandbox.html" class="nav-item">
          <span class="nav-icon">🧪</span>
          <span>Sandbox</span>
        </a>
        <a href="achievements.html" class="nav-item">
          <span class="nav-icon">🏆</span>
          <span>Achievements</span>
        </a>
        <a href="store.html" class="nav-item">
          <span class="nav-icon">🛒</span>
          <span>Store</span>
        </a>
        <a href="profile.html" class="nav-item">
          <span class="nav-icon">👤</span>
          <span>Profile</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="profile-card">
        <div class="profile-avatar">
          <img src="images/jeffimage.png" alt="Profile" />
        </div>
        <div class="profile-info">
          <div class="profile-name" id="userName">Player</div>
          <div class="profile-badge">
            <span class="badge-dot"></span>
            <span id="userBadge">Beginner Mathematician</span>
          </div>
          <div class="profile-level">
            <div class="level-header">
              <div class="level-text">
                <span class="level-icon">✨</span>
                <span>Level <span id="userLevel">1</span></span>
              </div>
              <div class="level-xp"><span id="currentXP">0</span>/<span id="maxXP">500</span> EXP</div>
            </div>
            <div class="level-bar">
              <div class="level-bar-fill" id="xpBar" style="width: 0%"></div>
            </div>
          </div>
          <div class="stats-row">
            <div class="stat-badge">
              <span class="stat-icon">🔥</span>
              <span class="stat-value" id="streakCount">0</span>
            </div>
            <div class="stat-badge">
              <span class="stat-icon">🐟</span>
              <span class="stat-value" id="fishFlakes">0</span>
            </div>
            <div class="stat-badge">
              <span class="stat-icon">⚡</span>
              <span class="stat-value" id="totalXP">0</span>
            </div>
          </div>
        </div>
      </div>

      <h2 class="section-title">Choose Mode</h2>

      <div class="modes-grid">
        <a href="level-select.html?mode=main" class="mode-card start-game">
          <div class="mode-icon-box">▶</div>
          <div class="mode-content">
            <div class="mode-title">Start Game</div>
            <div class="mode-description">Main progression</div>
          </div>
          <div class="mode-arrow">›</div>
        </a>

        <a href="level-select.html?mode=practice" class="mode-card practice">
          <div class="mode-icon-box">◎</div>
          <div class="mode-content">
            <div class="mode-title">Practice Mode</div>
            <div class="mode-description">No penalties, whale off</div>
          </div>
          <div class="mode-arrow">›</div>
        </a>

        <a href="daily.html" class="mode-card daily">
          <div class="mode-icon-box">📅</div>
          <div class="mode-content">
            <div class="mode-title">Daily Challenge</div>
            <div class="mode-description">Earn flakes and XP</div>
          </div>
          <div class="mode-arrow">›</div>
        </a>
      </div>
    </main>

    <nav class="bottom-nav d-md-none">
      <a href="dashboard.html" class="bottom-nav-item active">
        <span class="bottom-nav-icon">▶</span>
        <span>Play</span>
      </a>
      <a href="sandbox.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">🧪</span>
        <span>Sandbox</span>
      </a>
      <a href="achievements.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">🏆</span>
        <span>Achieve</span>
      </a>
      <a href="store.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">🛒</span>
        <span>Store</span>
      </a>
      <a href="profile.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "{}");

    if (currentUser.username) {
      document.getElementById("userName").textContent = currentUser.username;
    }

    if (currentUser.selectedExperience) {
      const badge = currentUser.selectedExperience === "Beginner Math" 
        ? "Beginner Mathematician" 
        : "Advanced Mathematician";
      document.getElementById("userBadge").textContent = badge;
    }

    if (currentUser.level) {
      document.getElementById("userLevel").textContent = currentUser.level;
    }

    if (currentUser.xp) {
      document.getElementById("currentXP").textContent = currentUser.xp;
      document.getElementById("totalXP").textContent = currentUser.xp;
      
      const maxXP = (currentUser.level || 1) * 500;
      document.getElementById("maxXP").textContent = maxXP;
      
      const percentage = (currentUser.xp / maxXP) * 100;
      document.getElementById("xpBar").style.width = `${Math.min(percentage, 100)}%`;
    }

    if (currentUser.streak) {
      document.getElementById("streakCount").textContent = currentUser.streak;
    }

    if (currentUser.fishFlakes) {
      document.getElementById("fishFlakes").textContent = currentUser.fishFlakes;
    }
  </script>
</body>
</html>
