<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding - Course</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/onboarding.css" />
</head>

<body>
  <div class="top-bar">
    <div class="progress-container">
      <button class="back-btn" id="backBtn" aria-label="Back">✕</button>
      <div class="progress-bar">
        <div class="progress-fill step-1"></div>
      </div>
    </div>
  </div>

  <main class="main-content">
    <section class="question-section">
      <div class="mascot-container">
        <div class="mascot-circle">
          <img src="images/jeffimage.png" alt="Fishquation mascot" />
        </div>
      </div>
      <div class="speech-bubble">
        <div class="speech-text">What would you like to learn?</div>
      </div>
    </section>

    <div class="options-list" id="courseList">
      <button class="option-card" type="button" data-course="Math">
        <div class="option-icon">🧮</div>
        <div class="option-text">Math</div>
      </button>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-container">
      <button class="continue-btn" id="continueBtn" type="button" disabled>Continue</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const backBtn = document.getElementById("backBtn");
    const continueBtn = document.getElementById("continueBtn");
    const courseList = document.getElementById("courseList");

    let selectedCourse = localStorage.getItem("onboarding_course") || "";

    function refresh() {
      [...courseList.querySelectorAll(".option-card")].forEach(btn => {
        btn.classList.toggle("selected", btn.dataset.course === selectedCourse);
      });
      continueBtn.disabled = !selectedCourse;
    }

    courseList.addEventListener("click", (e) => {
      const btn = e.target.closest(".option-card");
      if (!btn) return;
      selectedCourse = btn.dataset.course;
      localStorage.setItem("onboarding_course", selectedCourse);
      refresh();
    });

    continueBtn.addEventListener("click", () => {
      if (!selectedCourse) return;
      window.location.href = "onboarding-experience.html";
    });

    backBtn.addEventListener("click", () => history.back());

    refresh();
  </script>
</body>
</html>
