<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fishquation • Choose Level</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/level-select.css" />
</head>
<body>
  <div class="level-select-container">
    <div class="top-bar">
      <button class="back-btn" id="backBtn" aria-label="Back">←</button>
      <div class="stats-bar">
        <div class="stat-pill">
          <span class="stat-icon">🔥</span>
          <span id="streakCount">7</span>
        </div>
        <div class="stat-pill">
          <span class="stat-icon">🐟</span>
          <span id="fishFlakes">2637</span>
        </div>
        <div class="stat-pill">
          <span class="stat-icon">⚡</span>
          <span id="totalXP">1669</span>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="header-section">
        <div class="title-row">
          <h1 class="page-title">Choose Level</h1>
          <button class="info-btn" id="infoBtn" aria-label="Game Info">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </button>
        </div>
        <p class="progress-text">Progress: <span id="progressText">2/8</span> Levels</p>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar" style="width: 25%"></div>
        </div>
      </div>

      <div class="levels-grid" id="levelsGrid">
        <div class="level-card completed" data-level="1">
          <div class="level-number">1</div>
          <div class="stars-row">
            <span class="star earned">⭐</span>
            <span class="star earned">⭐</span>
            <span class="star earned">⭐</span>
          </div>
        </div>

        <div class="level-card completed" data-level="2">
          <div class="level-number">2</div>
          <div class="stars-row">
            <span class="star earned">⭐</span>
            <span class="star earned">⭐</span>
            <span class="star">⭐</span>
          </div>
        </div>

        <div class="level-card" data-level="3">
          <div class="level-number">3</div>
          <div class="stars-row">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
          </div>
        </div>

        <div class="level-card locked" data-level="4">
          <div class="level-number">🔒</div>
          <div class="stars-row">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
          </div>
        </div>

        <div class="level-card locked" data-level="5">
          <div class="level-number">🔒</div>
          <div class="stars-row">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
          </div>
        </div>

        <div class="level-card locked" data-level="6">
          <div class="level-number">🔒</div>
          <div class="stars-row">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
          </div>
        </div>

        <div class="level-card locked" data-level="7">
          <div class="level-number">🔒</div>
          <div class="stars-row">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
          </div>
        </div>

        <div class="level-card locked" data-level="8">
          <div class="level-number">🔒</div>
          <div class="stars-row">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
          </div>
        </div>
      </div>

      <button class="start-button" id="startBtn" disabled>Start</button>
    </div>
  </div>

  <div class="game-info-modal" id="gameInfoModal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">✕</button>
      
      <h2 class="modal-title">The Whale</h2>
      
      <div class="sketchfab-embed-wrapper">
        <iframe 
          title="Whale for Fishquation" 
          frameborder="0" 
          allowfullscreen 
          mozallowfullscreen="true" 
          webkitallowfullscreen="true" 
          allow="autoplay; fullscreen; xr-spatial-tracking" 
          xr-spatial-tracking 
          execution-while-out-of-viewport 
          execution-while-not-rendered 
          web-share 
          src="https://sketchfab.com/models/42617cdd2625435aafe55ca127980209/embed">
        </iframe>
        <p style="font-size: 13px; font-weight: normal; margin: 5px; color: #4A4A4A;">
          <a href="https://sketchfab.com/3d-models/whale-for-fishquation-42617cdd2625435aafe55ca127980209?utm_medium=embed&utm_campaign=share-popup&utm_content=42617cdd2625435aafe55ca127980209" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;">Whale for Fishquation</a> by <a href="https://sketchfab.com/fishermien?utm_medium=embed&utm_campaign=share-popup&utm_content=42617cdd2625435aafe55ca127980209" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;">fishermien</a> on <a href="https://sketchfab.com?utm_medium=embed&utm_campaign=share-popup&utm_content=42617cdd2625435aafe55ca127980209" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;">Sketchfab</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "{}");
    const gameMode = new URLSearchParams(window.location.search).get('mode') || 'main';
    
    let selectedLevel = null;

    if (currentUser.streak) {
      document.getElementById("streakCount").textContent = currentUser.streak;
    }

    if (currentUser.fishFlakes) {
      document.getElementById("fishFlakes").textContent = currentUser.fishFlakes;
    }

    if (currentUser.xp) {
      document.getElementById("totalXP").textContent = currentUser.xp;
    }

    const completedLevels = currentUser.completedLevels || 2;
    const totalLevels = 8;
    const progressPercentage = (completedLevels / totalLevels) * 100;
    
    document.getElementById("progressText").textContent = `${completedLevels}/${totalLevels}`;
    document.getElementById("progressBar").style.width = `${progressPercentage}%`;

    document.querySelectorAll('.level-card:not(.locked)').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.level-card').forEach(c => c.style.boxShadow = '');
        card.style.boxShadow = '0 0 0 3px #9810fa';
        
        selectedLevel = card.dataset.level;
        document.getElementById('startBtn').disabled = false;
      });
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      if (selectedLevel) {
        window.location.href = `game.html?mode=${gameMode}&level=${selectedLevel}`;
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });

    document.getElementById('infoBtn').addEventListener('click', () => {
      const modal = document.getElementById('gameInfoModal');
      modal.classList.add('active');
      setTimeout(() => {
        document.querySelector('.modal-content').scrollTop = 0;
      }, 10);
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('gameInfoModal').classList.remove('active');
    });

    document.getElementById('gameInfoModal').addEventListener('click', (e) => {
      if (e.target.id === 'gameInfoModal') {
        document.getElementById('gameInfoModal').classList.remove('active');
      }
    });
  </script>
</body>
</html>
