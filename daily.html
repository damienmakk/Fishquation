<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fishquation • Daily Challenge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/daily.css" />
</head>
<body>
  <div class="daily-container">
    <div class="top-bar">
      <button class="back-btn" id="backBtn" aria-label="Back">←</button>
      <div class="stats-bar">
        <div class="stat-pill">
          <span class="stat-icon">🔥</span>
          <span id="streakCount">7</span>
        </div>
        <div class="stat-pill">
          <span class="stat-icon">🐟</span>
          <span id="fishFlakes">2637</span>
        </div>
        <div class="stat-pill">
          <span class="stat-icon">⚡</span>
          <span id="totalXP">1669</span>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="header-section">
        <h1 class="page-title">Daily Challenges</h1>
        <p class="page-subtitle">Play. Earn. Upgrade</p>
      </div>

      <div class="challenges-grid">
        <div class="challenge-card" data-challenge="1">
          <div class="challenge-icon-box play">
            <span class="challenge-icon">🚀</span>
          </div>
          
          <div class="challenge-content">
            <div class="challenge-title">Play 3 Games</div>
            <div class="challenge-subtitle">Sharpen your skills!</div>
            
            <div class="challenge-rewards">
              <div class="reward-item">
                <span class="reward-icon">⚡</span>
                <span class="reward-value">+120</span>
              </div>
              <div class="reward-item">
                <span class="reward-icon">🐟</span>
                <span class="reward-value">+50</span>
              </div>
            </div>

            <div class="challenge-progress">
              <div class="progress-label">
                <span>PROGRESS</span>
                <span class="progress-count">2/3</span>
              </div>
              <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: 66%"></div>
              </div>
            </div>
          </div>

          <button class="challenge-arrow">›</button>
        </div>

        <div class="challenge-card" data-challenge="2">
          <div class="challenge-icon-box perfect">
            <span class="challenge-icon">✖</span>
          </div>
          
          <div class="challenge-content">
            <div class="challenge-title">Win without mistakes</div>
            <div class="challenge-subtitle">Perfect Win!</div>
            
            <div class="challenge-rewards">
              <div class="reward-item">
                <span class="reward-icon">⚡</span>
                <span class="reward-value">+100</span>
              </div>
              <div class="reward-item">
                <span class="reward-icon">🐟</span>
                <span class="reward-value">+10</span>
              </div>
            </div>

            <div class="challenge-progress">
              <div class="progress-label">
                <span>PROGRESS</span>
                <span class="progress-count">0/1</span>
              </div>
              <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <button class="challenge-arrow">›</button>
        </div>

        <div class="challenge-card" data-challenge="3">
          <div class="challenge-icon-box accuracy">
            <span class="challenge-icon">🎯</span>
          </div>
          
          <div class="challenge-content">
            <div class="challenge-title">100% Accuracy Clear</div>
            <div class="challenge-subtitle">Flawless!</div>
            
            <div class="challenge-rewards">
              <div class="reward-item">
                <span class="reward-icon">⚡</span>
                <span class="reward-value">+180</span>
              </div>
              <div class="reward-item">
                <span class="reward-icon">🐟</span>
                <span class="reward-value">+25</span>
              </div>
            </div>

            <div class="challenge-progress">
              <div class="progress-label">
                <span>PROGRESS</span>
                <span class="progress-count">0/1</span>
              </div>
              <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <button class="challenge-arrow">›</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser") || "{}");

    if (currentUser.streak) {
      document.getElementById("streakCount").textContent = currentUser.streak;
    }

    if (currentUser.fishFlakes) {
      document.getElementById("fishFlakes").textContent = currentUser.fishFlakes;
    }

    if (currentUser.xp) {
      document.getElementById("totalXP").textContent = currentUser.xp;
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });

    document.querySelectorAll('.challenge-card').forEach(card => {
      card.addEventListener('click', () => {
        const challengeNum = card.dataset.challenge;
        window.location.href = `game.html?mode=main&level=1&challenge=${challengeNum}`;
      });
    });
  </script>
</body>
</html>
